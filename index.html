<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Night Shift Cab Management</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#F7F8FA;color:#2D2D2D;font-family:'Segoe UI',sans-serif;min-height:100vh}
:root{--primary:#FF6B00;--primary-dark:#E05A00;--dark:#1A1A2E;--card:#FFFFFF;--border:#E5E7EB;--red:#E05252;--green:#22A96A;--bg:#F7F8FA;--text:#2D2D2D;--text2:#6B7280}
.hidden{display:none!important}
#topbar{background:var(--dark);border-bottom:3px solid var(--primary);padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
#topbar h1{color:#fff;font-size:18px;letter-spacing:.5px}
#topbar h1 span{color:var(--primary)}
.user-info{font-size:13px;color:#aaa;display:flex;align-items:center;gap:12px}
.user-info span{color:#fff}
#btn-logout{background:none;border:1px solid #555;color:#aaa;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px}
#btn-logout:hover{border-color:var(--primary);color:var(--primary)}
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:24px;background:linear-gradient(135deg,var(--dark) 0%,#2d2d5e 100%)}
.login-box{background:#fff;border-radius:16px;padding:40px;width:380px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.login-box h2{color:var(--primary);margin-bottom:8px;font-size:22px}
.login-box p{color:#888;font-size:13px;margin-bottom:28px}
.inp{width:100%;background:#F7F8FA;border:1px solid var(--border);color:#2D2D2D;padding:10px 14px;border-radius:6px;font-size:14px;margin-bottom:10px;outline:none}
.inp:focus{border-color:var(--primary)}
.btn{width:100%;padding:11px;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn-gold{background:var(--primary);color:#fff}
.btn-gold:hover{opacity:.85}
.err-msg{color:var(--red);font-size:12px;margin-top:6px;text-align:left}
#app{display:flex;flex-direction:column;min-height:100vh}
#main-content{flex:1;padding:24px}
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border);flex-wrap:wrap}
.tab-btn{background:none;border:none;color:var(--text2);padding:10px 18px;cursor:pointer;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-btn:hover{color:var(--primary)}
.tab-content{display:none}
.tab-content.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpi-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px 24px;flex:1;min-width:140px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpi-label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.kpi-val{font-size:26px;font-weight:700;color:var(--primary);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F3F4F6;color:var(--text2);padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);font-weight:600;font-size:12px;text-transform:uppercase}
td{padding:10px 12px;border-bottom:1px solid #F3F4F6;vertical-align:middle;color:var(--text)}
tr:hover td{background:#FFF7F2}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#DCFCE7;color:#15803D}
.badge-yellow{background:#FFF3E0;color:var(--primary)}
.badge-red{background:#FEE2E2;color:#DC2626}
.badge-gray{background:#F3F4F6;color:#6B7280}
.action-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;margin-right:4px}
.action-btn:hover{border-color:var(--primary);color:var(--primary)}
.action-btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:5px;border:none;cursor:pointer;font-weight:600}
.btn-sm-gold{background:var(--primary);color:#fff}
.btn-sm-gold:hover{opacity:.85}
.btn-sm-outline{background:none;border:1px solid var(--primary);color:var(--primary)}
.btn-sm-outline:hover{background:var(--primary);color:#fff}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#fff;border-radius:14px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{color:var(--primary);margin-bottom:20px;font-size:17px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.form-row input,.form-row select{width:100%;background:#F7F8FA;border:1px solid var(--border);color:#2D2D2D;padding:9px 12px;border-radius:6px;font-size:13px;outline:none}
.form-row input:focus,.form-row select:focus{border-color:var(--primary);background:#fff}
.form-row select option{background:#fff}
.modal-actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.assigned{color:var(--green);font-weight:600}
.pending-text{color:#F59E0B;font-style:italic}
.plan-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.plan-date{font-size:18px;font-weight:700;color:var(--primary);margin-bottom:12px}
.plan-row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-size:14px}
.plan-icon{width:20px;text-align:center;color:var(--primary);flex-shrink:0}
.plan-label{color:var(--text2);min-width:80px;font-size:12px;flex-shrink:0}
#toast{position:fixed;bottom:24px;right:24px;background:var(--dark);border-left:4px solid var(--primary);color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;transition:opacity .3s;opacity:0;box-shadow:0 4px 12px rgba(0,0,0,.2)}
#toast.show{opacity:1}
@media(max-width:600px){.two-col{grid-template-columns:1fr}.kpi{min-width:120px}#main-content{padding:12px}}
</style>
</head>
<body>

<div id="toast"></div>

<!-- LOGIN PAGE -->
<div id="login-page">
  <div style="text-align:center;margin-bottom:8px">
    <div style="color:var(--gold);font-size:28px;font-weight:700">🚗 Night Shift Cab</div>
    <div style="color:#666;font-size:13px;margin-top:4px">Female Employee Transport Management</div>
  </div>

  <div class="login-box">
    <h2>Employee / Admin Login</h2>
    <p>Login with your Cuemath Google account</p>
    <div id="g_id_signin" style="display:flex;justify-content:center"></div>
    <div id="google-err" class="err-msg" style="text-align:center;margin-top:10px"></div>
  </div>

  <div style="color:#555;font-size:13px">— OR —</div>

  <div class="login-box">
    <h2>Vendor Login</h2>
    <p>For Cab Company &amp; Security Agency</p>
    <input class="inp" id="v-name" placeholder="Vendor / Company Name" autocomplete="off">
    <input class="inp" id="v-pass" type="password" placeholder="Password">
    <div id="vendor-err" class="err-msg"></div>
    <button class="btn btn-gold" style="margin-top:8px" onclick="vendorLogin()">Login</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div id="topbar">
    <h1>🚗 Night Shift Cab Management</h1>
    <div class="user-info">
      <span id="user-display"></span>
      <span id="role-badge" class="badge"></span>
      <button id="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>
  <div id="main-content"></div>
</div>

<script>
const API = '';
let currentUser = null;
let routesCache = [];
let employeesCache = [];
let vendorsCache = [];
let rosterWeekOffset = 0;
let rosterDayMode = true;
let rosterSelectedDate = new Date().toISOString().split('T')[0];

async function initGoogle() {
  try {
    const cfg = await fetch(API + '/api/config').then(r => r.json());
    if (!cfg.google_client_id) { document.getElementById('google-err').textContent = 'Google login not configured'; return; }
    google.accounts.id.initialize({ client_id: cfg.google_client_id, callback: handleGoogleLogin });
    google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'filled_black', size: 'large', text: 'signin_with_google', width: 280 });
  } catch(e) { document.getElementById('google-err').textContent = 'Could not load Google login'; }
}

async function handleGoogleLogin(response) {
  const res = await apiPost('/api/auth/google', { token: response.credential });
  if (res.success) { currentUser = res.user; enterApp(); }
  else document.getElementById('google-err').textContent = 'Access denied: ' + (res.debug || 'Use your @cuemath.com account.');
}

async function vendorLogin() {
  const name = document.getElementById('v-name').value.trim();
  const pass = document.getElementById('v-pass').value;
  if (!name || !pass) { document.getElementById('vendor-err').textContent = 'Enter name and password'; return; }
  const res = await apiPost('/api/auth/vendor', { name, password: pass });
  if (res.success) {
    currentUser = { name: res.vendor.name, email: '', role: res.vendor.type === 'cab' ? 'cab' : 'security', vendor_id: res.vendor.id };
    enterApp();
  } else {
    document.getElementById('vendor-err').textContent = 'Invalid credentials';
  }
}

function logout() {
  currentUser = null;
  document.getElementById('login-page').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('v-name').value = '';
  document.getElementById('v-pass').value = '';
  document.getElementById('vendor-err').textContent = '';
  document.getElementById('google-err').textContent = '';
  rosterWeekOffset = 0;
}

function enterApp() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('user-display').textContent = currentUser.name || currentUser.email;
  const labels = { admin: 'Admin', employee: 'Employee', cab: 'Cab Company', security: 'Security Agency' };
  const classes = { admin: 'badge-yellow', employee: 'badge-green', cab: 'badge-green', security: 'badge-green' };
  const rb = document.getElementById('role-badge');
  rb.textContent = labels[currentUser.role] || currentUser.role;
  rb.className = 'badge ' + (classes[currentUser.role] || 'badge-gray');
  renderView();
}

function renderView() {
  const role = currentUser.role;
  if (role === 'admin') renderAdminView();
  else if (role === 'employee') renderEmployeeView();
  else if (role === 'cab') renderCabView();
  else if (role === 'security') renderSecurityView();
}

// ── ADMIN ──────────────────────────────────────────────────
async function renderAdminView() {
  document.getElementById('main-content').innerHTML = `
    <div class="tabs">
      <button class="tab-btn active" onclick="adminTab('roster',this)">Weekly Roster</button>
      <button class="tab-btn" onclick="adminTab('routes',this)">Routes</button>
      <button class="tab-btn" onclick="adminTab('employees',this)">Employees</button>
      <button class="tab-btn" onclick="adminTab('vendors',this)">Vendors</button>
      <button class="tab-btn" onclick="adminTab('daily',this)">Daily Plan</button>
      <button class="tab-btn" onclick="adminTab('inventory',this)">🍜 Inventory</button>
      <button class="tab-btn" onclick="adminTab('costsummary',this)">Cost Summary</button>
      <button class="tab-btn" onclick="adminTab('cost',this)">Cost Report</button>
      <button class="tab-btn" onclick="adminTab('costsplit',this)">Cost Split</button>
    </div>
    <div id="tab-roster" class="tab-content active"></div>
    <div id="tab-routes" class="tab-content"></div>
    <div id="tab-employees" class="tab-content"></div>
    <div id="tab-vendors" class="tab-content"></div>
    <div id="tab-daily" class="tab-content"></div>
    <div id="tab-inventory" class="tab-content"></div>
    <div id="tab-costsummary" class="tab-content"></div>
    <div id="tab-cost" class="tab-content"></div>
    <div id="tab-costsplit" class="tab-content"></div>`;
  await Promise.all([loadRoutes(), loadEmployees(), loadVendors()]);
  renderAdminRoster();
}

function adminTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  if (name === 'roster') renderAdminRoster();
  else if (name === 'routes') renderAdminRoutes();
  else if (name === 'employees') renderAdminEmployees();
  else if (name === 'vendors') renderAdminVendors();
  else if (name === 'daily') { renderDailyPlan(); }
  else if (name === 'inventory') { renderInventory(); }
  else if (name === 'costsummary') { renderCostSummary(); }
  else if (name === 'cost') { costViewAll = true; renderAdminCost(); }
  else if (name === 'costsplit') { costViewAll = true; renderAdminCostSplit(); }
}

async function loadRoutes() { routesCache = await fetch(API + '/api/admin/routes').then(r => r.json()).catch(() => []); }
async function loadEmployees() { employeesCache = await fetch(API + '/api/admin/employees').then(r => r.json()).catch(() => []); }
async function loadVendors() { vendorsCache = await fetch(API + '/api/admin/vendors').then(r => r.json()).catch(() => []); }

function getWeekDates(offset) {
  const today = new Date();
  const day = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.toISOString().split('T')[0]);
  }
  return dates;
}

function fmtDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short' }); }
function fmtDateLong(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }); }

async function renderAdminRoster() {
  let dateFrom, dateTo, periodLabel;
  if (rosterDayMode) {
    dateFrom = dateTo = rosterSelectedDate;
    periodLabel = new Date(rosterSelectedDate + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
  } else {
    const dates = getWeekDates(rosterWeekOffset);
    dateFrom = dates[0]; dateTo = dates[6];
    periodLabel = `${fmtDate(dates[0])} – ${fmtDate(dates[6])}`;
  }
  const roster = await fetch(`${API}/api/admin/roster?date_from=${dateFrom}&date_to=${dateTo}`).then(r => r.json()).catch(() => []);
  const totalCost = roster.reduce((s, r) => s + (parseFloat(r.cab_cost) || 0), 0);
  const assigned = roster.filter(r => r.driver_name).length;
  const guardAssigned = roster.filter(r => r.guard_name).length;

  let html = `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">${rosterDayMode ? 'Date' : 'Week'}</div><div class="kpi-val" style="font-size:14px">${periodLabel}</div></div>
      <div class="kpi"><div class="kpi-label">Total Entries</div><div class="kpi-val">${roster.length}</div></div>
      <div class="kpi"><div class="kpi-label">Cab Assigned</div><div class="kpi-val" style="color:var(--green)">${assigned}</div></div>
      <div class="kpi"><div class="kpi-label">Guard Assigned</div><div class="kpi-val" style="color:var(--green)">${guardAssigned}</div></div>
      <div class="kpi"><div class="kpi-label">Cost</div><div class="kpi-val">₹${totalCost.toLocaleString('en-IN')}</div></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        ${rosterDayMode ? `
          <button class="btn-sm btn-sm-outline" onclick="shiftRosterDay(-1)">◀ Prev</button>
          <input type="date" value="${rosterSelectedDate}" onchange="rosterSelectedDate=this.value;renderAdminRoster()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:#fff">
          <button class="btn-sm btn-sm-outline" onclick="rosterSelectedDate=new Date().toISOString().split('T')[0];renderAdminRoster()">Today</button>
          <button class="btn-sm btn-sm-outline" onclick="shiftRosterDay(1)">Next ▶</button>
          <button class="btn-sm btn-sm-outline" onclick="rosterDayMode=false;renderAdminRoster()" style="color:#aaa;font-size:12px">Week View</button>
        ` : `
          <button class="btn-sm btn-sm-outline" onclick="rosterWeekOffset--;renderAdminRoster()">◀ Prev</button>
          <button class="btn-sm btn-sm-outline" onclick="rosterWeekOffset=0;renderAdminRoster()">This Week</button>
          <button class="btn-sm btn-sm-outline" onclick="rosterWeekOffset++;renderAdminRoster()">Next ▶</button>
          <button class="btn-sm btn-sm-outline" onclick="rosterDayMode=true;rosterSelectedDate=new Date().toISOString().split('T')[0];renderAdminRoster()" style="color:#aaa;font-size:12px">Day View</button>
        `}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn-sm btn-sm-gold" onclick="openAddRosterModal()">+ Add to Roster</button>
        <button class="btn-sm btn-sm-outline" onclick="openWeeklyAssignGrid('${dateFrom}','${dateTo}')" style="color:#4fc3f7;border-color:#4fc3f7">📋 Weekly Assignment</button>
        <button class="btn-sm btn-sm-outline" onclick="downloadExcel('${dateFrom}','${dateTo}')" style="color:#4CAF50;border-color:#4CAF50">⬇ Download Excel</button>
      </div>
    </div>
    <div class="card" style="padding:0;overflow:auto">
    <table><thead><tr>
      <th>Date</th><th>Employee</th><th>Department</th><th>Route</th><th>Pick Up</th><th>Cab Details</th><th>Guard</th><th></th>
    </tr></thead><tbody>`;

  if (!roster.length) {
    html += `<tr><td colspan="9" style="text-align:center;color:#555;padding:30px">No entries this week. Click "+ Add to Roster"</td></tr>`;
  } else {
    roster.forEach(r => {
      const sameRouteCnt = roster.filter(x => x.route_id === r.route_id && String(x.shift_date).substring(0,10) === String(r.shift_date).substring(0,10)).length;
      const routeNote = sameRouteCnt > 1 ? `<br><small style="color:#aaa">(${sameRouteCnt} emp ko apply)</small>` : '';
      const cab = r.driver_name
        ? `<span class="assigned">✓ ${r.driver_name}<br><small style="color:#888">${r.vehicle_type} ${r.vehicle_number}</small></span><br><button class="action-btn" style="margin-top:4px;font-size:11px" onclick="adminAssignCab(${r.id},'${r.emp_name}','${r.shift_date}')">Edit</button>`
        : `<button class="btn-sm btn-sm-gold" style="font-size:11px;padding:4px 10px" onclick="adminAssignCab(${r.id},'${r.emp_name}','${r.shift_date}')">+ Assign Cab</button>${routeNote}`;
      const guard = r.guard_name
        ? `<span class="assigned">✓ ${r.guard_name}<br><small style="color:#888">${r.guard_mobile || ''}</small></span><br><button class="action-btn" style="margin-top:4px;font-size:11px" onclick="adminAssignGuard(${r.id},'${r.emp_name}','${r.shift_date}')">Edit</button>`
        : `<button class="btn-sm btn-sm-outline" style="font-size:11px;padding:4px 10px;color:#4fc3f7;border-color:#4fc3f7" onclick="adminAssignGuard(${r.id},'${r.emp_name}','${r.shift_date}')">+ Assign Guard</button>${routeNote}`;
      html += `<tr>
        <td><b>${fmtDate(r.shift_date)}</b></td>
        <td><b>${r.emp_name}</b><br><small style="color:#666">${r.mobile || ''}</small></td>
        <td style="color:#888;font-size:12px">${r.department || ''}</td>
        <td><span style="color:var(--primary)">${r.route_name}</span><br><small style="color:#666">${r.pick_time || ''}</small></td>
        <td style="font-size:12px">${r.pick_location || ''}</td>
        <td style="font-size:12px">${cab}</td>
        <td style="font-size:12px">${guard}</td>
        <td><button class="action-btn danger" onclick="deleteRosterEntry(${r.id})">✕</button></td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>`;
  document.getElementById('tab-roster').innerHTML = html;
}

function shiftRosterDay(n) {
  const d = new Date(rosterSelectedDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  rosterSelectedDate = d.toISOString().split('T')[0];
  renderAdminRoster();
}

function openAddRosterModal() {
  if (!employeesCache.length || !routesCache.length) { showToast('Add Employees and Routes first'); return; }
  const routeOpts = routesCache.map(r => `<option value="${r.id}">${r.route_name}</option>`).join('');
  const dateOpts = getWeekDates(rosterWeekOffset).map(d => {
    return `<option value="${d}">${new Date(d + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'short' })}</option>`;
  }).join('');
  const empCheckboxes = employeesCache.map(e => `
    <label style="display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;margin-bottom:6px;background:#fff" onclick="this.classList.toggle('selected-emp');this.querySelector('input').checked=!this.querySelector('input').checked">
      <input type="checkbox" value="${e.id}" style="margin-top:2px;accent-color:var(--primary)" onclick="event.stopPropagation()">
      <div>
        <div style="font-weight:600;font-size:13px">${e.emp_name}</div>
        <div style="font-size:11px;color:#888">📍 ${e.pickup_address || '—'}</div>
      </div>
    </label>`).join('');
  showModal(`
    <h3>Add to Roster</h3>
    <div class="form-row">
      <label style="display:flex;justify-content:space-between"><span>Employees <span id="sel-count" style="color:var(--primary)">(0 selected)</span></span>
        <span style="font-size:11px;color:var(--primary);cursor:pointer" onclick="toggleAllEmps()">Select All</span>
      </label>
      <div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:6px" id="emp-list" onchange="updateSelCount()">

function updateSelCount() {
  const checked = document.querySelectorAll('#emp-list input[type=checkbox]:checked').length;
  const el = document.getElementById('sel-count');

}

function toggleAllEmps() {
  const boxes = document.querySelectorAll('#emp-list input[type=checkbox]');
  const allChecked = [...boxes].every(b => b.checked);
  boxes.forEach(b => { b.checked = !allChecked; });
  updateSelCount();
}

async function submitAddRoster() {
  const selectedEmps = [...document.querySelectorAll('#emp-list input[type=checkbox]:checked')].map(b => b.value);
  if (!selectedEmps.length) { document.getElementById('modal-err').textContent = 'Kam se kam ek employee select karo'; return; }
  const routeId = document.getElementById('m-route').value;
  const date    = document.getElementById('m-date').value;
  const dname   = document.getElementById('m-dname').value.trim();
  const dmobile = document.getElementById('m-dmobile').value.trim();
  const vtype   = document.getElementById('m-vtype').value.trim();
  const vnum    = document.getElementById('m-vnum').value.trim();
  const gname   = document.getElementById('m-gname').value.trim();
  const gmobile = document.getElementById('m-gmobile').value.trim();

  const entries = selectedEmps.map(empId => ({ employee_id: empId, route_id: routeId, shift_date: date }));
  const res = await apiPost('/api/admin/roster', { entries });
  if (!res.success) { document.getElementById('modal-err').textContent = res.error || 'Error adding'; return; }

  // If cab/guard filled, assign to first new entry (auto-copy will handle rest)
  if (dname || gname) {
    const roster = await fetch(`${API}/api/admin/roster?date_from=${date}&date_to=${date}`).then(r => r.json()).catch(() => []);
    const first = roster.find(r => String(r.employee_id) === String(selectedEmps[0]) && String(r.shift_date).substring(0,10) === date);
    if (first?.id) {
      if (dname) await apiPost('/api/cab/assign', { roster_id: first.id, vendor_id: null, driver_name: dname, driver_mobile: dmobile, vehicle_type: vtype, vehicle_number: vnum });
      if (gname) await apiPost('/api/security/assign', { roster_id: first.id, vendor_id: null, guard_name: gname, guard_mobile: gmobile });
    }
  }

  closeModal();
  showToast(`✓ ${selectedEmps.length} employee${selectedEmps.length > 1 ? 's' : ''} roster mein add!`);
  renderAdminRoster();
}

async function deleteRosterEntry(id) {
  if (!confirm('Remove this roster entry?')) return;
  await apiPost('/api/admin/roster/delete', { id });
  renderAdminRoster();
}

async function loadAttendance() {
  const el = document.getElementById('att-content');
  if (!el) return;
  const [roster, settings] = await Promise.all([
    fetch(`${API}/api/admin/roster?date_from=${attendanceDate}&date_to=${attendanceDate}`).then(r => r.json()).catch(() => []),
    fetch(`${API}/api/admin/settings`).then(r => r.json()).catch(() => ({}))
  ]);
  const dayLabel = new Date(attendanceDate + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

  // Get saved attendance marks
  const savedAtt = JSON.parse(settings[`att_${attendanceDate}`] || '{}');
  const rosterEmpIds = roster.map(r => r.employee_id);

  // Show all employees, mark those in roster as "Scheduled", attendance as Present/Absent
  const allEmps = employeesCache;
  const present = allEmps.filter(e => savedAtt[e.id] === 'P').length;
  const absent  = allEmps.filter(e => savedAtt[e.id] === 'A').length;
  const wfh     = allEmps.filter(e => savedAtt[e.id] === 'WFH').length;
  const leave   = allEmps.filter(e => savedAtt[e.id] === 'L').length;
  const weekoff = allEmps.filter(e => savedAtt[e.id] === 'WO').length;

  let html = `
    <div style="font-size:16px;font-weight:700;color:var(--primary);margin-bottom:16px">${dayLabel}</div>
    <div class="kpi-row" style="margin-bottom:16px">
      <div class="kpi"><div class="kpi-label">Total</div><div class="kpi-val">${allEmps.length}</div></div>
      <div class="kpi"><div class="kpi-label">✅ Present</div><div class="kpi-val" style="color:var(--green)">${present}</div></div>
      <div class="kpi"><div class="kpi-label">❌ Absent</div><div class="kpi-val" style="color:var(--red)">${absent}</div></div>
      <div class="kpi"><div class="kpi-label">🏠 WFH</div><div class="kpi-val" style="color:#F59E0B">${wfh}</div></div>
      <div class="kpi"><div class="kpi-label">🌴 Leave</div><div class="kpi-val" style="color:#06B6D4">${leave}</div></div>
      <div class="kpi"><div class="kpi-label">🏖️ Week Off</div><div class="kpi-val" style="color:#8B5CF6">${weekoff}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button class="btn-sm btn-sm-outline" style="color:var(--green);border-color:var(--green)" onclick="markAllAtt('P','${attendanceDate}')">✅ All Present</button>
      <button class="btn-sm btn-sm-outline" style="color:var(--red);border-color:var(--red)" onclick="markAllAtt('A','${attendanceDate}')">❌ All Absent</button>
      <button class="btn-sm btn-sm-gold" onclick="saveAttendance('${attendanceDate}')">💾 Save</button>
    </div>
    <div class="card" style="padding:0;overflow:auto">
    <table><thead><tr><th>Employee</th><th>Department</th><th>Cab Scheduled</th><th>Attendance</th></tr></thead><tbody>`;

  allEmps.forEach(e => {
    const scheduled = rosterEmpIds.includes(e.id);
    const att = savedAtt[e.id] || '';
    html += `<tr>
      <td><b>${e.emp_name}</b><br><small style="color:#888">${e.mobile || ''}</small></td>
      <td style="color:#888;font-size:12px">${e.department || ''}</td>
      <td>${scheduled ? '<span class="badge badge-green">✓ Scheduled</span>' : '<span class="badge badge-gray">—</span>'}</td>
      <td>
        <select name="att_${e.id}" style="padding:7px 12px;border:1px solid ${attColor(att,'border')};border-radius:6px;font-size:13px;font-weight:600;color:${attColor(att,'text')};background:#fff;cursor:pointer" onchange="applyAttColor(this)">
          <option value="" ${att===''?'selected':''}>-- Select --</option>
          <option value="P"   ${att==='P'  ?'selected':''}>✅ Present</option>
          <option value="A"   ${att==='A'  ?'selected':''}>❌ Absent</option>
          <option value="WO"  ${att==='WO' ?'selected':''}>🏖️ Week Off</option>
          <option value="WFH" ${att==='WFH'?'selected':''}>🏠 Work From Home</option>
          <option value="L"   ${att==='L'  ?'selected':''}>🌴 Leave</option>
        </select>
      </td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  el.innerHTML = html;
}

function attColor(val, type) {
  const map = { P: ['var(--green)','var(--green)'], A: ['var(--red)','var(--red)'], WO: ['#8B5CF6','#8B5CF6'], WFH: ['#F59E0B','#F59E0B'], L: ['#06B6D4','#06B6D4'] };
  const colors = map[val] || ['var(--border)','var(--text2)'];
  return type === 'border' ? colors[0] : colors[1];
}

function applyAttColor(sel) {
  sel.style.color = attColor(sel.value, 'text');
  sel.style.borderColor = attColor(sel.value, 'border');
}

function markAllAtt(status, date) {
  employeesCache.forEach(e => {
    const sel = document.querySelector(`select[name="att_${e.id}"]`);
    if (sel) {
      sel.value = status;
      sel.style.color = status === 'P' ? 'var(--green)' : 'var(--red)';
      sel.style.borderColor = status === 'P' ? 'var(--green)' : 'var(--red)';
    }
  });
}

async function saveAttendance(date) {
  const attData = {};
  employeesCache.forEach(e => {
    const sel = document.querySelector(`select[name="att_${e.id}"]`);
    if (sel && sel.value) attData[e.id] = sel.value;
  });
  const res = await apiPost('/api/admin/settings', { [`att_${date}`]: JSON.stringify(attData) });
  if (res.success) {
    const p = Object.values(attData).filter(v => v === 'P').length;
    const a = Object.values(attData).filter(v => v === 'A').length;
    showToast(`✓ Attendance saved! Present: ${p}, Absent: ${a}`);
    loadAttendance();
  }
}

let costViewAll = false;

// ── COST REPORT ──
async function renderAdminCost() {
  document.getElementById('tab-cost').innerHTML = '<div style="padding:20px;color:#888">Loading...</div>';
  try {
  const dates = getWeekDates(rosterWeekOffset);
  const url = costViewAll
    ? `${API}/api/admin/roster`
    : `${API}/api/admin/roster?date_from=${dates[0]}&date_to=${dates[6]}`;
  const roster = await fetch(url).then(r => r.json()).catch(e => { throw e; });
  const totalCost = roster.reduce((s, r) => s + (parseFloat(r.cab_cost) || 0), 0);

  // Route summary
  const byRoute = {};
  roster.forEach(r => {
    if (!byRoute[r.route_name]) byRoute[r.route_name] = { count: 0, cost: 0, r };
    byRoute[r.route_name].count++;
    byRoute[r.route_name].cost += parseFloat(r.cab_cost) || 0;
  });

  // Date-wise summary
  const allRoutes = [...new Set(roster.map(r => r.route_name))].sort();
  const byDate = {};
  roster.forEach(r => {
    const d = String(r.shift_date).substring(0, 10);
    if (!byDate[d]) byDate[d] = { total: 0 };
    if (!byDate[d][r.route_name]) byDate[d][r.route_name] = { count: 0, cost: 0 };
    byDate[d][r.route_name].count++;
    byDate[d][r.route_name].cost += parseFloat(r.cab_cost) || 0;
    byDate[d].total += parseFloat(r.cab_cost) || 0;
  });

  let html = `
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total Trips</div><div class="kpi-val">${roster.length}</div></div>
      <div class="kpi"><div class="kpi-label">Total Cost</div><div class="kpi-val">₹${totalCost.toLocaleString('en-IN')}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
      ${costViewAll ? '' : `
        <button class="btn-sm btn-sm-outline" onclick="costViewAll=false;rosterWeekOffset--;renderAdminCost()">◀ Prev Week</button>
        <button class="btn-sm btn-sm-outline" onclick="costViewAll=false;rosterWeekOffset=0;renderAdminCost()">This Week</button>
        <button class="btn-sm btn-sm-outline" onclick="costViewAll=false;rosterWeekOffset++;renderAdminCost()">Next Week ▶</button>
      `}
      <button class="btn-sm ${costViewAll ? 'btn-sm-gold' : 'btn-sm-outline'}" onclick="costViewAll=!costViewAll;renderAdminCost()">
        ${costViewAll ? '✓ All Dates' : 'All Dates'}
      </button>
      ${costViewAll ? '' : `<span style="color:#666;font-size:12px">${dates[0]} – ${dates[6]}</span>`}
    </div>`;

  // ── Date-wise table ──
  html += `<h3 style="color:var(--gold);margin:0 0 10px">Date-wise Cost</h3>
    <div class="card" style="padding:0;overflow:auto;margin-bottom:24px">
    <table><thead><tr><th>Date</th>`;
  allRoutes.forEach(rt => html += `<th>${rt}<br><small style="color:#888;font-weight:400">Emp | Cost</small></th>`);
  html += `<th>Total Emp</th><th>Day Cost</th></tr></thead><tbody>`;

  if (!Object.keys(byDate).length) {
    html += `<tr><td colspan="${allRoutes.length + 3}" style="text-align:center;color:#555;padding:24px">No data for this week</td></tr>`;
  } else {
    let grandTotal = 0; let grandEmp = 0;
    Object.keys(byDate).sort().forEach(date => {
      const day = byDate[date];
      let dayEmp = 0;
      allRoutes.forEach(rt => { if (day[rt]) dayEmp += day[rt].count; });
      html += `<tr><td><b>${fmtDate(date)}</b></td>`;
      allRoutes.forEach(rt => {
        const d = day[rt];
        html += d
          ? `<td style="text-align:center"><span style="color:#4fc3f7;font-weight:600">${d.count} emp</span><br><span style="color:var(--gold)">₹${d.cost.toLocaleString('en-IN')}</span></td>`
          : `<td style="text-align:center;color:#444">—</td>`;
      });
      html += `<td style="text-align:center;color:#4fc3f7;font-weight:700">${dayEmp}</td>`;
      html += `<td style="color:var(--gold);font-weight:700">₹${day.total.toLocaleString('en-IN')}</td></tr>`;
      grandTotal += day.total; grandEmp += dayEmp;
    });
    html += `<tr style="background:#111">
      <td colspan="${allRoutes.length + 1}" style="text-align:right;font-weight:700;color:#fff;padding:10px">Week Total:</td>
      <td style="color:#4fc3f7;font-weight:700;font-size:15px;text-align:center">${grandEmp}</td>
      <td style="color:var(--gold);font-weight:700;font-size:15px">₹${grandTotal.toLocaleString('en-IN')}</td></tr>`;
  }
  html += `</tbody></table></div>`;

  // ── Route summary table ──
  html += `<h3 style="color:var(--gold);margin:0 0 10px">Route-wise Summary</h3>
    <div class="card" style="padding:0;overflow:auto">
    <table><thead><tr><th>Route</th><th>Trips This Week</th><th>Cost per Trip</th><th>Total Cost</th></tr></thead><tbody>`;

  if (!Object.keys(byRoute).length) {
    html += `<tr><td colspan="4" style="text-align:center;color:#555;padding:24px">No data</td></tr>`;
  } else {
    Object.values(byRoute).forEach(({ count, cost, r }) => {
      html += `<tr>
        <td><b>${r.route_name}</b><br><small style="color:#666">${r.pick_location || ''}</small></td>
        <td style="text-align:center">${count}</td>
        <td style="color:var(--gold)">₹${(parseFloat(r.cab_cost) || 0).toLocaleString('en-IN')}</td>
        <td style="color:var(--gold);font-weight:700">₹${cost.toLocaleString('en-IN')}</td>
      </tr>`;
    });
    html += `<tr style="background:#111"><td colspan="3" style="text-align:right;font-weight:700;color:#fff">Total:</td>
      <td style="color:var(--gold);font-weight:700;font-size:15px">₹${totalCost.toLocaleString('en-IN')}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  document.getElementById('tab-cost').innerHTML = html;
  } catch(err) {
    document.getElementById('tab-cost').innerHTML = `<div style="padding:20px;color:red">Error: ${err.message || err}</div>`;
  }
}

async function openWeeklyAssignGrid(dateFrom, dateTo) {
  const roster = await fetch(`${API}/api/admin/roster?date_from=${dateFrom}&date_to=${dateTo}`).then(r => r.json()).catch(() => []);
  if (!roster.length) { showToast('Is week mein koi roster entry nahi hai'); return; }

  const dates = [...new Set(roster.map(r => String(r.shift_date).substring(0,10)))].sort();
  const routes = [...new Map(roster.map(r => [r.route_id, {id: r.route_id, name: r.route_name}])).values()].sort((a,b) => a.name.localeCompare(b.name));

  // Pre-fill: route+date → existing assignment
  const existing = {};
  roster.forEach(r => {
    const key = r.route_id + '|' + String(r.shift_date).substring(0,10);
    if (!existing[key]) existing[key] = { driver_name: r.driver_name || '', driver_mobile: r.driver_mobile || '', vehicle_type: r.vehicle_type || '', vehicle_number: r.vehicle_number || '', guard_name: r.guard_name || '', guard_mobile: r.guard_mobile || '' };
  });

  // Build grid
  let html = `<h3>📋 Weekly Assignment Grid</h3>
    <p style="color:#888;font-size:12px;margin-bottom:16px">Har route ke liye driver aur guard bharo → Save All karo</p>
    <div style="overflow:auto">
    <table style="min-width:700px;font-size:12px">
    <thead><tr>
      <th style="min-width:120px">Route</th>`;
  dates.forEach(d => {
    html += `<th style="min-width:180px;text-align:center">${fmtDate(d)}</th>`;
  });
  html += `</tr></thead><tbody>`;

  routes.forEach(rt => {
    html += `<tr><td style="font-weight:700;color:var(--primary);vertical-align:top;padding-top:10px">${rt.name}</td>`;
    dates.forEach(d => {
      const key = rt.id + '|' + d;
      const ex = existing[key] || {};
      const hasRoster = roster.some(r => r.route_id === rt.id && String(r.shift_date).substring(0,10) === d);
      if (!hasRoster) {
        html += `<td style="color:#ccc;text-align:center;font-size:11px">—</td>`;
      } else {
        html += `<td style="padding:4px">
          <input placeholder="Driver naam" value="${ex.driver_name}" data-route="${rt.id}" data-date="${d}" data-f="driver_name" style="width:100%;margin-bottom:3px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px">
          <input placeholder="Mobile" value="${ex.driver_mobile}" data-route="${rt.id}" data-date="${d}" data-f="driver_mobile" style="width:100%;margin-bottom:3px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px">
          <input placeholder="Vehicle (e.g. Swift)" value="${ex.vehicle_type}" data-route="${rt.id}" data-date="${d}" data-f="vehicle_type" style="width:100%;margin-bottom:3px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px">
          <input placeholder="Number (HR 26 AX)" value="${ex.vehicle_number}" data-route="${rt.id}" data-date="${d}" data-f="vehicle_number" style="width:100%;margin-bottom:6px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:11px">
          <div style="border-top:1px solid #eee;padding-top:4px">
          <input placeholder="Guard naam" value="${ex.guard_name}" data-route="${rt.id}" data-date="${d}" data-f="guard_name" style="width:100%;margin-bottom:3px;padding:4px 6px;border:1px solid #4fc3f7;border-radius:4px;font-size:11px">
          <input placeholder="Guard mobile" value="${ex.guard_mobile}" data-route="${rt.id}" data-date="${d}" data-f="guard_mobile" style="width:100%;padding:4px 6px;border:1px solid #4fc3f7;border-radius:4px;font-size:11px">
          </div>
        </td>`;
      }
    });
    html += `</tr>`;
  });

  html += `</tbody></table></div>
    <div id="modal-err" class="err-msg"></div>
    <div class="modal-actions">
      <button class="btn-sm btn-sm-outline" onclick="closeModal()">Cancel</button>
      <button class="btn-sm btn-sm-gold" onclick="submitWeeklyGrid()">💾 Save All</button>
    </div>`;

  // Use full-width modal
  const old = document.getElementById('modal-overlay');
  if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'modal-overlay';
  div.id = 'modal-overlay';
  div.innerHTML = `<div class="modal" style="width:95vw;max-width:1100px">${html}</div>`;
  div.addEventListener('click', e => { if (e.target === div) closeModal(); });
  document.body.appendChild(div);
}

async function submitWeeklyGrid() {
  const inputs = document.querySelectorAll('#modal-overlay input[data-route]');

  inputs.forEach(inp => {
    const key = inp.dataset.route + '|' + inp.dataset.date;
    if (!data[key]) data[key] = { route_id: parseInt(inp.dataset.route), date: inp.dataset.date };

async function loadInvItems() {
  const items = await fetch(`${API}/api/admin/inventory`).then(r => r.json()).catch(() => []);
  const el = document.getElementById('inv-content');
  const lowStock = items.filter(i => parseFloat(i.current_stock) <= parseFloat(i.min_stock));

  let html = ``;

  if (lowStock.length) {
    html += `<div style="background:#FEF3C7;border:1px solid #FCD34D;border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px">
      ⚠️ <b>Low Stock Alert:</b> ${lowStock.map(i => `${i.item_name} (${i.current_stock} ${i.unit})`).join(', ')}
    </div>`;
  }

  html += `<div class="card" style="padding:0;overflow:auto">
  <table><thead><tr><th>Item</th><th>Unit</th><th>Current Stock</th><th>Min Stock</th><th>Cost/Unit</th><th>Last Purchase</th><th>Status</th><th></th></tr></thead><tbody>`;

  if (!items.length) {
    html += `<tr><td colspan="8" style="text-align:center;color:#888;padding:30px">Koi item nahi. "+ Add Item" se shuru karo</td></tr>`;
  } else {
    items.forEach(i => {
      const stock = parseFloat(i.current_stock);
      const minS  = parseFloat(i.min_stock);
      const status = stock <= 0 ? `<span class="badge badge-red">Out of Stock</span>`
        : stock <= minS ? `<span class="badge badge-yellow">⚠️ Low</span>`
        : `<span class="badge badge-green">✓ OK</span>`;
      html += `<tr>
        <td><b>${i.item_name}</b></td>
        <td style="color:#888">${i.unit}</td>
        <td style="font-weight:700;font-size:15px;color:${stock<=minS?'var(--red)':'var(--green)'}">${stock}</td>
        <td style="color:#888">${minS}</td>
        <td style="color:var(--primary)">₹${parseFloat(i.cost_per_unit).toLocaleString('en-IN')}</td>
        <td style="color:#888;font-size:12px">${i.purchase_date ? fmtDate(i.purchase_date) : '—'}</td>
        <td>${status}</td>
        <td>
          <button class="action-btn" onclick='openInvModal(${JSON.stringify(i)})'>Edit</button>
          <button class="action-btn danger" onclick="deleteInvItem(${i.id})">Delete</button>
        </td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
}

async function submitInvItem(id) {

async function submitDailyUse() {
  const items = await fetch(`${API}/api/admin/inventory`).then(r => r.json()).catch(() => []);
  const today = new Date().toISOString().split('T')[0];
  let saved = 0;
  for (const i of items) {
    const qty = parseFloat(document.getElementById(`use_${i.id}`)?.value || 0);
    if (qty > 0) {
      await apiPost('/api/admin/inventory/log', { item_id: i.id, quantity: qty, log_type: 'use', log_date: today, note: document.getElementById(`note_${i.id}`)?.value || '' });

  }
  showToast(`✓ ${saved} items ka use save ho gaya!`);
  loadInvItems();
  invSubTab = 'items';
  renderInventory();
}

async function loadInvPurchases() {
  const el = document.getElementById('inv-content');
  const [logs, items] = await Promise.all([
    fetch(`${API}/api/admin/inventory/log`).then(r => r.json()).catch(() => []),
    fetch(`${API}/api/admin/inventory`).then(r => r.json()).catch(() => [])
  ]);
  const purchases = logs.filter(l => l.log_type === 'add');

  // filter by selected month
  const monthPurchases = purchases.filter(p => String(p.log_date).substring(0,7) === purMonth);

  let totalCost = 0;
  monthPurchases.forEach(p => { totalCost += parseFloat(p.quantity) * (parseFloat(p.cost_per_unit)||0); });

  // monthly summary by item
  const summary = {};
  monthPurchases.forEach(p => {
    if (!summary[p.item_name]) summary[p.item_name] = { unit: p.unit, count: 0, totalQty: 0, totalCost: 0 };
    summary[p.item_name].count++;
    summary[p.item_name].totalQty += parseFloat(p.quantity);
    summary[p.item_name].totalCost += parseFloat(p.quantity) * (parseFloat(p.cost_per_unit)||0);
  });

  const itemOpts = items.map(i => `<option value="${i.id}" data-cost="${i.cost_per_unit||0}" data-unit="${i.unit}">${i.item_name}</option>`).join('');

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <button class="btn-sm btn-sm-gold" onclick="openNewPurchaseModal()">+ New Purchase</button>
    <div style="display:flex;align-items:center;gap:10px">
      <input type="month" value="${purMonth}" onchange="purMonth=this.value;loadInvPurchases()" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:13px">
      <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:14px">
        Total Spend: <b style="color:var(--primary)">₹${totalCost.toLocaleString('en-IN')}</b>
      </div>
    </div>
  </div>`;

  // Monthly summary card
  if (Object.keys(summary).length) {
    html += `<div class="card" style="margin-bottom:16px">
      <div style="font-weight:700;margin-bottom:10px;font-size:14px">📊 Monthly Summary — ${purMonth}</div>
      <table><thead><tr><th>Item</th><th>Times Purchased</th><th>Total Units</th><th>Total Cost</th></tr></thead><tbody>`;
    Object.entries(summary).forEach(([name, s]) => {
      html += `<tr>
        <td><b>${name}</b></td>
        <td style="text-align:center;font-weight:700;color:var(--primary)">${s.count} baar</td>
        <td style="font-weight:700">${s.totalQty} ${s.unit}</td>
        <td style="font-weight:700;color:var(--green)">₹${s.totalCost.toLocaleString('en-IN')}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  html += `<div class="card" style="padding:0;overflow:auto">
  <table><thead><tr><th>Date of Purchase</th><th>Item</th><th>Total Unit</th><th>Cost per Unit</th><th>Total Cost</th><th></th></tr></thead><tbody>`;

  if (!monthPurchases.length) {
    html += `<tr><td colspan="6" style="text-align:center;color:#888;padding:24px">Is mahine koi purchase nahi.</td></tr>`;
  } else {
    monthPurchases.forEach(p => {
      const qty = parseFloat(p.quantity);
      const cpu = parseFloat(p.cost_per_unit)||0;
      const total = qty * cpu;
      html += `<tr>
        <td style="font-weight:600">${fmtDate(String(p.log_date).substring(0,10))}</td>
        <td><b>${p.item_name}</b> <span style="color:#888;font-size:12px">(${p.unit})</span></td>
        <td style="font-weight:700">${qty} ${p.unit}</td>
        <td>₹${cpu}</td>
        <td style="font-weight:700;color:var(--primary)">${total>0?'₹'+total.toLocaleString('en-IN'):'—'}</td>
        <td><button class="action-btn danger" onclick="deletePurchaseLog(${p.id})">Delete</button></td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>`;
  el.innerHTML = html;
  window._invItemOpts = itemOpts;
}

function shiftSummaryDay(n) {
  const d = new Date(summaryDailyDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  summaryDailyDate = d.toISOString().split('T')[0];
  const picker = document.getElementById('summary-day-picker');
  if (picker) picker.value = summaryDailyDate;
  loadDailyCostData();
}

async function loadDailyCostData() {
  const el = document.getElementById('daily-cost-data');
  if (!el) return;
  const [roster, settings] = await Promise.all([
    fetch(`${API}/api/admin/roster?date_from=${summaryDailyDate}&date_to=${summaryDailyDate}`).then(r => r.json()).catch(() => []),
    fetch(`${API}/api/admin/settings`).then(r => r.json()).catch(() => ({}))
  ]);
  const savedHeadcount = parseInt(settings[`headcount_${summaryDailyDate}`] || roster.length);
  const dayLabel = new Date(summaryDailyDate + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

  if (!roster.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px;color:#888"><div style="font-size:32px;margin-bottom:10px">📋</div><div>${dayLabel}</div><div style="font-size:13px;margin-top:6px;color:#aaa">Koi data nahi</div></div>`;
    return;
  }

  const tripSeen = {};
  const byRoute = {};
  roster.forEach(r => {
    const rname = r.route_name;
    const key = rname + '|' + summaryDailyDate;
    const cab = parseFloat(r.cab_cost) || 0;
    const guard = parseFloat(r.guard_cost) || 0;
    if (!byRoute[rname]) byRoute[rname] = { empCount: 0, cabCost: 0, guardCost: 0 };

async function loadCostSummary_data() {
  const el = document.getElementById('monthly-data');
  if (!el) return;
  const [y, m] = summaryMonth.split('-');
  const lastDay = new Date(y, m, 0).getDate();
  const dateFrom = `${summaryMonth}-01`;
  const dateTo   = `${summaryMonth}-${String(lastDay).padStart(2, '0')}`;

  const roster = await fetch(`${API}/api/admin/roster?date_from=${dateFrom}&date_to=${dateTo}`).then(r => r.json()).catch(() => []);

  if (!roster.length) {
    const [yr, mo] = summaryMonth.split('-');
    const mLabel = new Date(yr, mo - 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    el.innerHTML = `<div style="text-align:center;padding:60px;color:#888"><div style="font-size:32px;margin-bottom:12px">📊</div><div>${mLabel} mein koi data nahi</div></div>`;
    return;
  }

  // Unique trips per route+date (cab cost once per trip)
  const tripSeen = {};
  const byRoute = {};
  const byDate  = {};

  roster.forEach(r => {
    const date  = String(r.shift_date).substring(0, 10);
    const rname = r.route_name;
    const tripKey = rname + '|' + date;
    const cabCost   = parseFloat(r.cab_cost)   || 0;
    const guardCost = parseFloat(r.guard_cost)  || 0;

    if (!byRoute[rname]) byRoute[rname] = { empCount: 0, trips: 0, cabCost: 0, guardCost: 0, perCab: cabCost, perGuard: guardCost };
    byRoute[rname].empCount++;
    if (!tripSeen[tripKey]) {
      tripSeen[tripKey] = true;
      byRoute[rname].trips++;
      byRoute[rname].cabCost   += cabCost;
      byRoute[rname].guardCost += guardCost;
    }

    if (!byDate[date]) byDate[date] = { empCount: 0, cabCost: 0, guardCost: 0 };
    byDate[date].empCount++;
  });

  // Fill date cab/guard cost from unique trips
  Object.keys(tripSeen).forEach(key => {
    const [rname, date] = key.split('|');
    const r = byRoute[rname];
    byDate[date].cabCost   += r.perCab;
    byDate[date].guardCost += r.perGuard;
  });

  const totalEmp   = roster.length;
  const totalTrips = Object.keys(tripSeen).length;
  const totalCab   = Object.values(byRoute).reduce((s, r) => s + r.cabCost, 0);
  const totalGuard = Object.values(byRoute).reduce((s, r) => s + r.guardCost, 0);
  const totalSnack = totalEmp * snackCostPerEmp;
  const grandTotal = totalCab + totalGuard + totalSnack;

  const [yr, mo] = summaryMonth.split('-');
  const mLabel = new Date(yr, mo - 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

  let html = `
    <div style="font-size:17px;font-weight:700;color:var(--primary);margin-bottom:16px">📊 ${mLabel}</div>
    <div class="kpi-row" style="margin-bottom:24px">
      <div class="kpi"><div class="kpi-label">Total Employees</div><div class="kpi-val">${totalEmp}</div></div>
      <div class="kpi"><div class="kpi-label">Total Trips</div><div class="kpi-val">${totalTrips}</div></div>
      <div class="kpi"><div class="kpi-label">🚗 Cab Cost</div><div class="kpi-val" style="color:var(--primary)">₹${totalCab.toLocaleString('en-IN')}</div></div>
      <div class="kpi"><div class="kpi-label">🛡️ Guard Cost</div><div class="kpi-val" style="color:#4fc3f7">₹${totalGuard.toLocaleString('en-IN')}</div></div>
      <div class="kpi"><div class="kpi-label">🍜 Snack Cost</div><div class="kpi-val" style="color:#F59E0B">₹${totalSnack.toLocaleString('en-IN')}</div></div>
      <div class="kpi"><div class="kpi-label">Grand Total</div><div class="kpi-val">₹${grandTotal.toLocaleString('en-IN')}</div></div>
    </div>

    <h3 style="color:var(--primary);margin:0 0 10px">Route-wise Summary</h3>
    <div class="card" style="padding:0;overflow:auto;margin-bottom:24px">
    <table><thead><tr>
      <th>Route</th><th>Trips</th><th>Employees</th>
      <th style="color:var(--primary)">Cab Cost/Trip</th><th style="color:var(--primary)">Total Cab</th>
      <th style="color:#4fc3f7">Guard Cost/Trip</th><th style="color:#4fc3f7">Total Guard</th>
      <th>Grand Total</th>
    </tr></thead><tbody>`;

  Object.entries(byRoute).sort().forEach(([name, d]) => {
    const total = d.cabCost + d.guardCost;
    html += `<tr>
      <td><b>${name}</b></td>
      <td style="text-align:center">${d.trips}</td>
      <td style="text-align:center">${d.empCount}</td>
      <td style="color:var(--primary)">₹${d.perCab.toLocaleString('en-IN')}</td>
      <td style="color:var(--primary);font-weight:600">₹${d.cabCost.toLocaleString('en-IN')}</td>
      <td style="color:#4fc3f7">₹${d.perGuard.toLocaleString('en-IN')}</td>
      <td style="color:#4fc3f7;font-weight:600">₹${d.guardCost.toLocaleString('en-IN')}</td>
      <td style="font-weight:700">₹${total.toLocaleString('en-IN')}</td>
    </tr>`;
  });
  html += `<tr style="background:#FFF7F2">
    <td colspan="4" style="text-align:right;font-weight:700">Grand Total:</td>
    <td style="color:var(--primary);font-weight:700;font-size:15px">₹${totalCab.toLocaleString('en-IN')}</td>
    <td></td>
    <td style="color:#4fc3f7;font-weight:700;font-size:15px">₹${totalGuard.toLocaleString('en-IN')}</td>
    <td style="font-weight:700;font-size:15px">₹${grandTotal.toLocaleString('en-IN')}</td>
  </tr>`;
  html += `</tbody></table></div>

  <h3 style="color:var(--primary);margin:0 0 10px">Date-wise Summary</h3>
  <div class="card" style="padding:0;overflow:auto">
  <table><thead><tr>
    <th>Date</th><th>Employees</th>
    <th style="color:var(--primary)">Cab Cost</th>
    <th style="color:#4fc3f7">Guard Cost</th>
    <th>Total</th>
  </tr></thead><tbody>`;

  let gCab = 0, gGuard = 0, gEmp = 0;
  Object.keys(byDate).sort().forEach(date => {
    const d = byDate[date];
    const total = d.cabCost + d.guardCost;
    gCab += d.cabCost; gGuard += d.guardCost; gEmp += d.empCount;
    html += `<tr>
      <td><b>${fmtDate(date)}</b></td>
      <td style="text-align:center">${d.empCount}</td>
      <td style="color:var(--primary);font-weight:600">₹${d.cabCost.toLocaleString('en-IN')}</td>
      <td style="color:#4fc3f7;font-weight:600">₹${d.guardCost.toLocaleString('en-IN')}</td>
      <td style="font-weight:700">₹${total.toLocaleString('en-IN')}</td>
    </tr>`;
  });
  html += `<tr style="background:#FFF7F2">
    <td style="font-weight:700">Total</td>
    <td style="text-align:center;font-weight:700">${gEmp}</td>
    <td style="color:var(--primary);font-weight:700;font-size:15px">₹${gCab.toLocaleString('en-IN')}</td>
    <td style="color:#4fc3f7;font-weight:700;font-size:15px">₹${gGuard.toLocaleString('en-IN')}</td>
    <td style="font-weight:700;font-size:15px">₹${(gCab+gGuard).toLocaleString('en-IN')}</td>
  </tr>`;
  html += `</tbody></table></div>`;

  el.innerHTML = html;
}

function shiftDay(n) {
  const d = new Date(dailyDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  dailyDate = d.toISOString().split('T')[0];
  document.getElementById('daily-date-picker').value = dailyDate;
  loadDailyPlan();
}

async function loadDailyPlan() {
  const el = document.getElementById('daily-plan-content');
  if (!el) return;
  el.innerHTML = '<div style="color:#888;padding:20px">Loading...</div>';
  const roster = await fetch(`${API}/api/admin/roster?date_from=${dailyDate}&date_to=${dailyDate}`).then(r => r.json()).catch(() => []);

  const dayLabel = new Date(dailyDate + 'T00:00:00').toLocaleDateString('en-IN', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });

  if (!roster.length) {
    el.innerHTML = `<div style="text-align:center;padding:60px;color:#888">
      <div style="font-size:36px;margin-bottom:12px">📋</div>
      <div style="font-size:16px">${dayLabel}</div>
      <div style="font-size:13px;margin-top:8px;color:#aaa">Is din koi roster entry nahi hai</div>
    </div>`;
    return;
  }

  // Group by route
  const byRoute = {};
  roster.forEach(r => {
    if (!byRoute[r.route_name]) byRoute[r.route_name] = { route_id: r.route_id, cab: { driver_name: r.driver_name, driver_mobile: r.driver_mobile, vehicle_type: r.vehicle_type, vehicle_number: r.vehicle_number }, guard: { guard_name: r.guard_name, guard_mobile: r.guard_mobile }, employees: [] };
    byRoute[r.route_name].employees.push({ name: r.emp_name, mobile: r.mobile, pickup: r.pickup_address || '', roster_id: r.id });
  });

  const totalEmp = roster.length;
  const cabDone = Object.values(byRoute).filter(r => r.cab.driver_name).length;
  const guardDone = Object.values(byRoute).filter(r => r.guard.guard_name).length;
  const totalRoutes = Object.keys(byRoute).length;

  let html = `
    <div style="font-size:16px;font-weight:700;color:var(--primary);margin-bottom:16px">${dayLabel}</div>
    <div class="kpi-row" style="margin-bottom:20px">
      <div class="kpi"><div class="kpi-label">Total Employees</div><div class="kpi-val">${totalEmp}</div></div>
      <div class="kpi"><div class="kpi-label">Routes</div><div class="kpi-val">${totalRoutes}</div></div>
      <div class="kpi"><div class="kpi-label">Cab Assigned</div><div class="kpi-val" style="color:${cabDone===totalRoutes?'var(--green)':'var(--primary)'}">${cabDone}/${totalRoutes}</div></div>
      <div class="kpi"><div class="kpi-label">Guard Assigned</div><div class="kpi-val" style="color:${guardDone===totalRoutes?'var(--green)':'#4fc3f7'}">${guardDone}/${totalRoutes}</div></div>
    </div>`;

  Object.entries(byRoute).sort().forEach(([routeName, data]) => {
    const cabStatus = data.cab.driver_name
      ? `<span class="badge badge-green">✓ ${data.cab.driver_name} | ${data.cab.vehicle_type || ''} ${data.cab.vehicle_number || ''}</span>`
      : `<span class="badge badge-red">Cab Pending</span>`;
    const guardStatus = data.guard.guard_name
      ? `<span class="badge badge-green">✓ ${data.guard.guard_name}</span>`
      : `<span class="badge badge-red">Guard Pending</span>`;

    html += `<div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:14px">
        <div>
          <div style="font-size:16px;font-weight:700;color:var(--primary)">${routeName}</div>
          <div style="font-size:12px;color:#888;margin-top:4px">${data.employees.length} employee${data.employees.length>1?'s':''}</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn-sm btn-sm-gold" style="font-size:12px" onclick='openDailyAssign("${routeName}",${data.route_id},"${dailyDate}",${JSON.stringify(data.cab).replace(/'/g,"&#39;")},${JSON.stringify(data.guard).replace(/'/g,"&#39;")})'>
            ${data.cab.driver_name ? '✏️ Edit Cab' : '🚗 Assign Cab'}
          </button>
          <button class="btn-sm btn-sm-outline" style="font-size:12px;color:#4fc3f7;border-color:#4fc3f7" onclick='openDailyAssign("${routeName}",${data.route_id},"${dailyDate}",${JSON.stringify(data.cab).replace(/'/g,"&#39;")},${JSON.stringify(data.guard).replace(/'/g,"&#39;")})'>
            ${data.guard.guard_name ? '✏️ Edit Guard' : '🛡️ Assign Guard'}
          </button>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        ${cabStatus} ${guardStatus}
      </div>
      <table style="width:100%"><thead><tr>
        <th>Employee</th><th>Mobile</th><th>Pickup Address</th>
      </tr></thead><tbody>`;

    data.employees.forEach(e => {
      html += `<tr>
        <td><b>${e.name}</b></td>
        <td style="color:#888">${e.mobile || '—'}</td>
        <td style="color:#888;font-size:12px">${e.pickup || '—'}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });

  el.innerHTML = html;
}

function openDailyAssign(routeName, routeId, date, cab, guard) {
  showModal(`
    <h3>📋 ${routeName} — ${fmtDate(date)}</h3>
    <div style="border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:10px">🚗 Cab Details</div>
      <div class="two-col">
        <div class="form-row"><label>Driver Name</label><input id="dd-dname" value="${cab.driver_name||''}"></div>
        <div class="form-row"><label>Driver Mobile</label><input id="dd-dmobile" value="${cab.driver_mobile||''}"></div>
      </div>
      <div class="two-col">
        <div class="form-row"><label>Vehicle Type</label><input id="dd-vtype" value="${cab.vehicle_type||''}" placeholder="e.g. Swift Dzire"></div>
        <div class="form-row"><label>Vehicle Number</label><input id="dd-vnum" value="${cab.vehicle_number||''}" placeholder="e.g. HR 26 AX 1234"></div>
      </div>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:#4fc3f7;margin-bottom:10px">🛡️ Security Guard</div>
      <div class="two-col">
        <div class="form-row"><label>Guard Name</label><input id="dd-gname" value="${guard.guard_name||''}"></div>
        <div class="form-row"><label>Guard Mobile</label><input id="dd-gmobile" value="${guard.guard_mobile||''}"></div>
      </div>
    </div>
    <div id="modal-err" class="err-msg"></div>
    <div class="modal-actions">
      <button class="btn-sm btn-sm-outline" onclick="closeModal()">Cancel</button>
      <button class="btn-sm btn-sm-gold" onclick="submitDailyAssign(${routeId},'${date}')">💾 Save</button>
    </div>`);
}

async function submitDailyAssign(routeId, date) {
  const assignment = {
    route_id: routeId, date,
    driver_name: document.getElementById('dd-dname').value.trim(),
    driver_mobile: document.getElementById('dd-dmobile').value.trim(),
    vehicle_type: document.getElementById('dd-vtype').value.trim(),
    vehicle_number: document.getElementById('dd-vnum').value.trim(),
    guard_name: document.getElementById('dd-gname').value.trim(),
    guard_mobile: document.getElementById('dd-gmobile').value.trim()
  };
  const res = await apiPost('/api/admin/bulk-assign', { assignments: [assignment] });
  if (res.success) { closeModal(); showToast(`✓ Assigned!`); loadDailyPlan(); }
  else document.getElementById('modal-err').textContent = res.error || 'Error';
}

        `}
        <button class="btn-sm ${costViewAll ? 'btn-sm-gold' : 'btn-sm-outline'}" onclick="costViewAll=!costViewAll;renderAdminCostSplit()">
          ${costViewAll ? '✓ All Dates' : 'All Dates'}
        </button>
      </div>
      <h3 style="color:var(--primary);margin:0 0 10px">Date-wise Cost Split</h3>
      <div class="card" style="padding:0;overflow:auto;margin-bottom:24px">
      <table><thead><tr>
        <th>Date</th><th>Route</th><th>Employees</th>
        <th style="color:var(--primary)">Cab Cost (₹)</th>
        <th style="color:#4fc3f7">Guard Cost (₹)</th>
        <th>Total (₹)</th>
      </tr></thead><tbody>`;

    if (!Object.keys(byDate).length) {
      html += `<tr><td colspan="6" style="text-align:center;color:#555;padding:24px">No data found</td></tr>`;
    } else {
      let prevDate = '';
      let sortedEntries = [];
      Object.keys(byDate).sort().forEach(date => {
        allRoutes.forEach(rt => {
          if (byDate[date][rt]) sortedEntries.push({ date, rt, ...byDate[date][rt] });
        });
      });
      sortedEntries.forEach((e, i) => {
        const isNewDate = e.date !== prevDate;
        if (isNewDate) prevDate = e.date;
        const total = e.cabCost + e.guardCost;
        html += `<tr>
          <td>${isNewDate ? `<b>${fmtDate(e.date)}</b>` : ''}</td>
          <td><b>${e.rt}</b></td>
          <td style="text-align:center;font-weight:600;color:#4fc3f7">${e.empCount}</td>
          <td style="color:var(--primary);font-weight:600">₹${e.cabCost.toLocaleString('en-IN')}</td>
          <td style="color:#4fc3f7;font-weight:600">₹${e.guardCost.toLocaleString('en-IN')}</td>
          <td style="font-weight:700">₹${total.toLocaleString('en-IN')}</td>
        </tr>`;
      });
      html += `<tr style="background:#f0f4ff">
        <td colspan="2" style="text-align:right;font-weight:700;color:var(--text)">Grand Total:</td>
        <td style="text-align:center;font-weight:700;color:#4fc3f7">${grandEmp}</td>
        <td style="color:var(--primary);font-weight:700;font-size:15px">₹${grandCab.toLocaleString('en-IN')}</td>
        <td style="color:#4fc3f7;font-weight:700;font-size:15px">₹${grandGuard.toLocaleString('en-IN')}</td>
        <td style="font-weight:700;font-size:15px">₹${(grandCab + grandGuard).toLocaleString('en-IN')}</td>
      </tr>`;
    }
    html += `</tbody></table></div>`;

    // Route-wise summary
    const byRoute = {};
    roster.forEach(r => {
      if (!byRoute[r.route_name]) byRoute[r.route_name] = { trips: new Set(), empCount: 0, cabCost: parseFloat(r.cab_cost) || 0, guardCost: parseFloat(r.guard_cost) || 0 };
      byRoute[r.route_name].trips.add(String(r.shift_date).substring(0, 10));
      byRoute[r.route_name].empCount++;
    });

    html += `<h3 style="color:var(--primary);margin:0 0 10px">Route-wise Summary</h3>
      <div class="card" style="padding:0;overflow:auto">
      <table><thead><tr><th>Route</th><th>Cab Cost/Trip</th><th>Guard Cost/Trip</th><th>Total Trips</th><th>Total Cab</th><th>Total Guard</th><th>Grand Total</th></tr></thead><tbody>`;

    let sumCab = 0, sumGuard = 0;
    Object.entries(byRoute).sort().forEach(([name, d]) => {
      const trips = d.trips.size;
      const totalCab = d.cabCost * trips;
      const totalGuard = d.guardCost * trips;
      sumCab += totalCab; sumGuard += totalGuard;
      html += `<tr>
        <td><b>${name}</b></td>
        <td style="color:var(--primary)">₹${d.cabCost.toLocaleString('en-IN')}</td>
        <td style="color:#4fc3f7">₹${d.guardCost.toLocaleString('en-IN')}</td>
        <td style="text-align:center">${trips}</td>
        <td style="color:var(--primary);font-weight:600">₹${totalCab.toLocaleString('en-IN')}</td>
        <td style="color:#4fc3f7;font-weight:600">₹${totalGuard.toLocaleString('en-IN')}</td>
        <td style="font-weight:700">₹${(totalCab + totalGuard).toLocaleString('en-IN')}</td>
      </tr>`;
    });
    html += `<tr style="background:#f0f4ff">
      <td colspan="4" style="text-align:right;font-weight:700">Grand Total:</td>
      <td style="color:var(--primary);font-weight:700;font-size:15px">₹${sumCab.toLocaleString('en-IN')}</td>
      <td style="color:#4fc3f7;font-weight:700;font-size:15px">₹${sumGuard.toLocaleString('en-IN')}</td>
      <td style="font-weight:700;font-size:15px">₹${(sumCab + sumGuard).toLocaleString('en-IN')}</td>
    </tr>`;
    html += `</tbody></table></div>`;

    document.getElementById('tab-costsplit').innerHTML = html;
  } catch(err) {
    document.getElementById('tab-costsplit').innerHTML = `<div style="padding:20px;color:red">Error: ${err.message || err}</div>`;
  }
}

// ── UTILS ─────────────────────────────────────────────────
function downloadExcel(dateFrom, dateTo) {
  const url = `${API}/api/admin/export?date_from=${dateFrom}&date_to=${dateTo}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `cab_roster_${dateFrom}_to_${dateTo}.xlsx`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

async function apiPost(endpoint, data) {
  try {
    return await fetch(API + endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json());
  } catch(e) { return { success: false, error: e.message }; }
}

function showModal(html) {
  const old = document.getElementById('modal-overlay');
  if (old) old.remove();
  const div = document.createElement('div');
  div.className = 'modal-overlay';
  div.id = 'modal-overlay';
  div.innerHTML = `<div class="modal">${html}</div>`;
  div.addEventListener('click', e => { if (e.target === div) closeModal(); });
  document.body.appendChild(div);
}

function closeModal() { const m = document.getElementById('modal-overlay'); if (m) m.remove(); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
